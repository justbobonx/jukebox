<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>node-musicmetadata browser example</title>
</head>

<body>
  <h1>Drop an audio file anywhere...</h1>
  <form>...or enter its URL here: <input value="../test/samples/id3v2.4.mp3" /><input type="submit" /></form>
  <img id='myimg'>
  <div id="info"/>

  <script src="musicmetadata.js"></script>
  <script src="howler.min.js"></script>
  
  <script type="text/javascript">
    // https://github.com/mikolalysenko/drag-and-drop-files


    function handleDrop(callback, event) {
      event.stopPropagation()
      event.preventDefault()
      callback( Array.prototype.slice.call(event.dataTransfer.files) )
    }

    function killEvent(e) {
      e.stopPropagation()
      e.preventDefault()
      return false
    }

    function addDragDropListener(element, callback) {
      element.addEventListener("dragenter", killEvent, false)
      element.addEventListener("dragover", killEvent, false)
      element.addEventListener("drop", handleDrop.bind(undefined, callback), false)
    }

    function showMetaData(data)
	{
      musicmetadata(data, function (err, result) {
        if (err) throw err;
        console.log(result);
        if (result.picture.length > 0) {
          var picture = result.picture[0];
          var url = URL.createObjectURL(new Blob([picture.data], {'type': 'image/' + picture.format}));
          var image = document.getElementById('myimg');
          image.src = url;
        }
        var div = document.getElementById('info');
        div.innerText = JSON.stringify(result, undefined, 2);
      });
    }


    addDragDropListener(document, function (files)
	{
     
	 showMetaData( files[0] );
	  
	  var url = URL.createObjectURL( files[0] );
	  
	  //var url = URL.createObjectURL( new Blob( [Uint8Array.from( song.cover.data )], {'type': 'image/jpg'})) ;
	  
	  var url = "_Classic Rock/Santana - Black Magic Woman.mp3"
	  
	  var fileReader = new FileReader();
	  fileReader.readAsArrayBuffer(files[0]);
	  fileReader.addEventListener("load", e => {
		if (e && e.target && e.target.result && files !== null) {
		  var arrayBuffer = e.target.result;
		  //var base64Str = Buffer.from(arrayBuffer).toString("base64");
		  //var base64Str = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
		  var base64Str = btoa([].reduce.call(new Uint8Array(arrayBuffer),function(p,c){return p+String.fromCharCode(c)},'')) 
		  var contentType = "audio/mp3";
		  var sound = new Howl({
			src: [`data:${contentType};base64,${base64Str}`]
		  });
		  sound.play();
		}
	  });
	  
	  <!-- next_song_a = new Howl({  -->
		<!-- src:  [encodeURIComponent(url)], -->
		<!-- autoplay: true, -->
		<!-- onload: function() { -->
			<!-- console.log('loaded!'); -->
		<!-- }, -->
		<!-- onplayerror: function(i,e) { -->
			<!-- console.log(e); -->
		<!-- } -->
	  <!-- }); -->
	  <!-- <!-- next_song_a.on('load', function(){ --> -->
			<!-- <!-- next_song_a(); --> -->
		<!-- <!-- }) --> -->
	  <!-- next_song_a.play();	 -->
	  
    });

    document.querySelector("form").addEventListener("submit", function(e) {
      e.preventDefault();
      var url = document.querySelector("input").value;
      var xhr = new XMLHttpRequest();
      xhr.responseType = "arraybuffer";
      xhr.open("get", url, true);
      xhr.onload = function(e) {
        showMetaData(e.target.response);
      }
      xhr.send();
    });
  </script>
</body>
