<!DOCTYPE html>
<html>
<head>
<title>JB Library</title>

<script src='jquery-1.11.1.min.js'></script>
<script src='jquery.cookie.min.js'></script>
<script src="jsmediatags.min.js"></script>
<script src="sql-wasm.js"></script>
<script src='jukedb.js'></script>

<script src='library.js'></script>

<link rel='stylesheet' type='text/css' href='jukebox.css' />
<style>
html, body { height:100%; }
body { margin:0; color:#dddddd; font-family:Tahoma, Geneva, sans-serif; font-size:14px; display:flex; flex-direction:column; overflow:hidden; }
select, input { font-size:14px; }
.lib_bar { margin:4px 0px; white-space:nowrap; }
.lib_bar > * { vertical-align:middle; }
#lib_head { flex:none; padding:12px 12px 6px 12px; background:#191919; }
#lib_status { color:#888888; font-size:12px; margin:4px 0px; }
#lib_counts { color:#ffcc77; font-size:12px; }
#lib_list { flex:1; overflow:auto; margin:0 12px 12px 12px; min-height:0; }
.lib_song { font-size:15px; padding:1px 4px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lib_song:nth-child(odd) { background:#222222; }
.lib_song:hover { background:#333333; }
.lib_song .lib_art { font-size:13px; }
.lib_song .lib_path { font-size:11px; color:#777777; }
.lib_added { background:#555522 !important; }
.lib_extra { color:#ccaa99; margin-left:1.5em; }
#lib_sort { max-width:240px; }
#lib_overlay { display:none; position:fixed; left:0; top:0; right:0; bottom:0; z-index:100; background:rgba(0,0,0,0.75); align-items:center; justify-content:center; }
#lib_overlay_box { width:360px; padding:18px 22px; background:#1a1a1a; border:1px solid #555555; border-radius:8px; text-align:center; }
#lib_overlay_msg { font-size:16px; color:#dddddd; margin-bottom:10px; }
#lib_prog_bar { width:100%; height:14px; background:#111111; border:1px solid #444444; border-radius:4px; overflow:hidden; }
#lib_prog_fill { width:0%; height:100%; background:#55cc66; }
</style>
</head>

<body>

<div id='lib_head'>
	<div id='lib_pick' class='lib_bar' style='display:none;'>
		<span id='btn_lib_open' class="button no_select" style="font-size:14px;padding:5px 8px;display:none;"></span>
		<span id='btn_lib_pick' class="button no_select" style="font-size:14px;padding:5px 8px;">pick music folder</span>
	</div>

	<div id='lib_main' style='display:none;'>
		<div class='lib_bar'>
			<select id='lib_who' style='width:40px; height:24px; border:1px solid #555555;'>
				<option value='0' style='background:#993333;'>&nbsp;</option>
				<option value='1' style='background:#338833;'>&nbsp;</option>
				<option value='2' style='background:#3333bb;'>&nbsp;</option>
				<option value='3' style='background:#9922aa;'>&nbsp;</option>
			</select>
			<input id='lib_search' type='text' placeholder='search title, artist, file' style='width:300px;'>
			<select id='lib_sort'>
				<option value='artist_song'>artist - song</option>
				<option value='artist_album_track'>artist - album - track</option>
				<option value='song'>song</option>
				<option value='year_artist_song'>year - artist - song</option>
				<option value='folder_artist_song'>folder - artist - song</option>
				<option value='folder_track'>folder - track</option>
				<option value='folder_song'>folder - song</option>
				<option value='filename'>filename</option>
			</select>
			<span id='btn_lib_scan' class="button no_select" style="font-size:14px;padding:5px 8px;">rescan</span>
		</div>
		<div class='lib_bar'>
			<select id='lib_folder' style='max-width:420px;'></select>
			<span id='btn_lib_hide' class="button no_select" style="font-size:12px;padding:4px 6px;">hide</span>
			&nbsp;
			<select id='lib_hidden' style='max-width:260px;color:#888888;'></select>
			<span id='btn_lib_unhide' class="button no_select" style="font-size:12px;padding:4px 6px;">unhide</span>
		</div>
		<div id='lib_counts'></div>
	</div>

	<div id='lib_status'></div>
</div>

<div id='lib_list'></div>

<div id='lib_overlay'>
	<div id='lib_overlay_box'>
		<div id='lib_overlay_msg'></div>
		<div id='lib_prog_bar'><div id='lib_prog_fill'></div></div>
	</div>
</div>

</body>
</html>
